name: Build WebGL on tag

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: webgl-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-webgl:
    name: Build WebGL (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build WebGL
        uses: game-ci/unity-builder@v5
        id: unity-build
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: auto
          targetPlatform: WebGL
          buildsPath: build
          versioning: Tag

      - name: Verify WebGL output
        shell: bash
        run: test -f build/WebGL/index.html

      - name: Prepare artifact name
        id: artifact-name
        shell: bash
        run: echo "name=WebGL-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload WebGL build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: build
          if-no-files-found: error
          retention-days: 14
